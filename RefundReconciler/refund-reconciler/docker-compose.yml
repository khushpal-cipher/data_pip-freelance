services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refund_reconciler
      POSTGRES_USER: refund_reconciler
      POSTGRES_PASSWORD: refund_reconciler
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://refund_reconciler:refund_reconciler@postgres:5432/refund_reconciler
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info -Q refunds
    env_file: .env
    environment:
      DATABASE_URL: postgresql://refund_reconciler:refund_reconciler@postgres:5432/refund_reconciler
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

volumes:
  pgdata:
