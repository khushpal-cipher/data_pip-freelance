services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncguard
      POSTGRES_PASSWORD: syncguard
      POSTGRES_DB: syncguard
    ports:
      - "5432:5432"
    volumes:
      - syncguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://syncguard:syncguard@db:5432/syncguard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  syncguard_pgdata:
